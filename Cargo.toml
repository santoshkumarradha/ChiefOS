[workspace]
resolver = "2"
members = [
    "prototypes/harness",
    "prototypes/region-router",
    "prototypes/event-log",
    "prototypes/chief-mem",
    "prototypes/chief-inference",
    "crates/chief-core",
    "crates/chief-cli",
]
exclude = [
    # Keep future exclusions explicit; empty for now.
]

[workspace.package]
edition = "2021"
version = "0.0.1"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/santoshkumarradha/ChiefOS"
publish = false

[workspace.dependencies]
# Cryptography & hashing
blake3 = "1.5"
ed25519-dalek = "2"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1.3"

# Async / runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# Error handling / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web / transport (for chief-core HTTP API)
axum = "0.7"
tower = "0.4"
hyper = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Dev
criterion = "0.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
