[package]
name = "chief-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Chief OS kernel integration: starts L2 services and exposes HTTP + Unix socket APIs."

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["net", "process", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }
axum.workspace = true
tower = { workspace = true }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap.workspace = true
chrono.workspace = true
thiserror.workspace = true
async-trait.workspace = true
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
rusqlite = { version = "0.29", features = ["bundled", "chrono"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"

# Router dependencies
toml.workspace = true
num_cpus.workspace = true

# SDK types
chief-sdk = { path = "../../crates/chief-sdk" }
chief-oauth = { path = "../../crates/chief-oauth" }

# Internal
chief-harness-proto       = { path = "../../prototypes/harness" }
chief-region-router-proto = { path = "../../prototypes/region-router" }
chief-event-log-proto     = { path = "../../prototypes/event-log" }
chief-mem                 = { path = "../../prototypes/chief-mem" }
chief-inference           = { path = "../../prototypes/chief-inference" }

[[bin]]
name = "chief-core"
path = "src/main.rs"

[[bin]]
name = "chief_core_server"
path = "src/bin/chief_core_server.rs"

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = "0.3"
