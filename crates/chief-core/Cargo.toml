[package]
name = "chief-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Chief OS kernel integration: starts L2 services and exposes HTTP + Unix socket APIs."

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["net", "process", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }
axum.workspace = true
tower = { workspace = true }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap.workspace = true
chrono.workspace = true
thiserror.workspace = true
async-trait.workspace = true
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
rusqlite = { version = "0.29", features = ["bundled", "chrono"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"

# Router dependencies
toml.workspace = true
num_cpus.workspace = true

# SDK types
chief-sdk = { path = "../../crates/chief-sdk" }
chief-oauth = { path = "../../crates/chief-oauth" }

# Internal crates
chief-mem                 = { path = "../../crates/chief-mem" }
chief-inference           = { path = "../../crates/chief-inference" }
document-pack             = { path = "../../packs/document-pack" }
calendar-pack             = { path = "../../packs/calendar-pack" }
email-pack                = { path = "../../packs/email-pack" }
risk-pack                 = { path = "../../packs/risk-pack" }

# Legacy prototypes (still consumed; slated for removal when chief-core fully supersedes them)
chief-harness-proto       = { path = "../../spikes/harness", package = "chief-harness-proto" }
chief-region-router-proto = { path = "../../spikes/region-router", package = "chief-region-router-proto" }
chief-event-log-proto     = { path = "../../spikes/event-log", package = "chief-event-log-proto" }

[[bin]]
name = "chief-core"
path = "src/main.rs"

[[bin]]
name = "chief_core_server"
path = "src/bin/chief_core_server.rs"

# Demo orchestrator binary. Boots chief-core HTTP API + schedules the
# hn-briefer / file-watcher ticks with real capability-escalation on a
# narrow net.http grant. See `src/bin/demo_run.rs` for the full story.
[[bin]]
name = "demo_run"
path = "src/bin/demo_run.rs"

[[bin]]
name = "platform_demo_run"
path = "src/bin/platform_demo_run.rs"

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = "0.3"
