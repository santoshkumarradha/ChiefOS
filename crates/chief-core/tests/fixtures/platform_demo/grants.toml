[[grants]]
pack = "email-pack"
kind = "mem.read"
scope = { roots = ["mem://artifact/acme-follow-up"], types = ["artifact", "finding", "email"] }
usage_reason = "Read Work Object context to draft the Acme reply."

[[grants]]
pack = "email-pack"
kind = "mem.write"
scope = { types = ["artifact"] }
usage_reason = "Persist the drafted reply as an artifact for Ceremony review."
