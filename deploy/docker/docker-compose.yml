# Chief OS — live demo (deploy/docker/docker-compose.yml)
#
# From the repo root:
#   docker compose -f deploy/docker/docker-compose.yml up --build

services:
  chief-os-demo:
    build:
      # Context is the repo root — the Dockerfile copies the whole workspace.
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: chief-os-demo:latest
    container_name: chief-os-demo
    ports:
      - "0.0.0.0:${CHIEF_DEMO_PORT:-8080}:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info,reqwest=warn}
      CHIEF_CORE_URL: http://127.0.0.1:8080
    volumes:
      # Persistent state: broker SQLite, memory graph, attestations, sealed secrets.
      - ./chief-state:/var/chief
      # Workspace for the file-watcher pack. Drop markdown / txt in here
      # and it surfaces as a Morning Brief card on the next tick.
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/status"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 45s
    restart: unless-stopped
