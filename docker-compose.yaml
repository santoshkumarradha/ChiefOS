services:
  chief:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override at build time: docker compose build --build-arg MODEL_URL=<url>
        MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
        MODEL_SHA256: 626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d
    image: chief-os:latest
    container_name: chief-os
    ports:
      # 4711 = chief-core HTTP API (intent, status, brief, etc.)
      # Bind host-side to 0.0.0.0 explicitly so the IPv6 host mapping
      # (which Docker Desktop adds by default and which doesn't reach the
      # container's IPv4-only listeners) doesn't shadow the IPv4 one.
      - "0.0.0.0:4711:4711"
      # 5173 = Morning Brief static files (served by busybox httpd inside the container)
      - "0.0.0.0:5173:5173"
    volumes:
      # Persistent state directory
      - chief-state:/var/lib/chief
    environment:
      # Chief configuration
      CHIEF_MODEL_PATH: /model/qwen2.5-3b.gguf
      CHIEF_STATE_DIR: /var/lib/chief
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4711/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  chief-state:
    driver: local
