- kind: discovery
  content: chief-fs prototype will keep alias store at chief_home/aliases.sqlite and CAS at chief_home/cas, with capture_paths doing a recursive one-shot ingest of declared directories for v0 while fanotify/FSEvents remain platform-specific shims.
  tags: []
  task_ref: null
- kind: discovery
  content: CAS implementation uses BLAKE3 lowercase hex CIDs and stores blobs under CHIEF_HOME/cas/aa/bb/cid. put_bytes writes via same-directory temp file + hard link publish, so existing blobs are not overwritten and duplicate content resolves to the existing blob.
  tags: []
  task_ref: task-4
