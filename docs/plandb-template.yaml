  task_ref: task-5
- kind: discovery
  content: 'Rust workspace patterns: root workspace resolver=2, edition 2021, rust-version 1.75; prototypes are workspace members with package-local Cargo.toml, src/lib.rs for libraries, tests/ for integration. Workspace deps include blake3, tokio, anyhow, serde, rusqlite bundled, chrono, tempfile; uuid is used by chief-inference but not yet workspace-level.'
  tags: []
  task_ref: task-2
- kind: discovery
  content: 'Chief FS constraints: accepted ADR-0006 defines BLAKE3 CAS plus FUSE human-folder shim; CIDs must survive rename/move; deletes/tombstones preserve CAS blobs; capture daemon hashes writes, updates alias/index, and eventually emits provenance events. Prototype should stay local-first and boring below L2.'
