  title: 'Wave 5a: HN / Substack briefer pack (first dogfood, uses chief-ui v0)'
  description: |-
    FIRST DOGFOOD PACK — validates the public SDK + UI kit by consuming only their exported surface.

    Purpose: every morning, fetch Hacker News top stories and the user's subscribed Substack feed, filter/score via on-device LLM, persist top 3-5 as memory nodes, render one brief card in the Brief list.

    PlanDB:
    - ID: t-w5-hn-brief2
    - Branch: int/hn-briefer (worktree ../chief-os-w5-hn-brief already created from main 9cbc534)
    - PlanDB db: pin: export PLANDB_DB=/Users/santoshkumarradha/Documents/agentfield/code/labs/nix/.plandb.db
    - Agent name suggestion: PLANDB_AGENT=codex-hn-brief

    Strict file scope (parallel-safety):
      ONLY modify:
      - prototypes/hn-briefer/** (new)
      - Root Cargo.toml — add prototypes/hn-briefer to workspace members. Do NOT touch other members.
      NEVER touch:
      - crates/chief-sdk/**, crates/chief-ui/**, crates/chief-core/**, crates/chief-oauth/**
      - packages/chief-sdk-ts/**, packages/chief-ui-ts/**
      - prototypes/hello-world-pack/**, prototypes/morning-brief/** etc.
      - Any doc, ADR, or legal/brand file.

    Public API discipline (ADR-0011 + ADR-0010):
    - Consume ONLY @chief-os/sdk and @chief-os/ui public exports.
    - UI composition uses <Row>, <Badge variant='handled'|'review'|'needs-you'>, <SourceAvatar color='amber'|'blue'|...>, <Pane>, <SectionHeader>. NO raw HTML/CSS for UI chrome.
    - Rust pack uses chief-sdk Pack/Agent/CapabilityContext only. No direct chief-core imports. No chief-ui Rust crate import needed (pack emits Card data; rendering happens in the Brief consumer).

    Grants declared in pack manifest (manifest.toml):
    - net.http { hosts: ['news.ycombinator.com','hn.algolia.com'] } — usage_reason: 'fetch HN top-stories feed'
    - net.http { hosts: ['*.substack.com'] } — usage_reason: 'fetch user Substack feeds'
    - mem.write { types: ['thought','card'] } — usage_reason: 'persist briefed items to Memory Graph'
    - surface.pane { surfaces: ['morning-brief'] } — usage_reason: 'render daily HN + Substack card in Brief'
    - llm.generate { max_tokens: 500 } — usage_reason: 'summarize + score stories'

    Implementation (Rust only at v0 — Card rendering is data, not React):
    1. prototypes/hn-briefer/Cargo.toml — depends on chief-sdk (workspace member), serde, reqwest, tokio.
    2. src/lib.rs — impl Pack + one Agent that on morning trigger: fetch HN top (10) via ctx.net().http(), score via ctx.llm().generate() with a compact prompt, pick top 5, write each as mem://thought/hn-<id> + one aggregate mem://card/hn-briefer-daily via ctx.memory().write(), emit a Card matching the chief-ui <Row> contract (sender='HN Briefer', subject, snippet, badge='handled', timestamp=now, source_color='amber').
    3. manifest.toml — the 5 grants above, with usage_reason on each.
    4. tests/integration.rs — full smoke using SDK InMemoryConnector stubs: inject mock HTTP responses, run the agent, assert memory nodes written + Card emitted with the correct badge variant.
    5. README.md — 20-line README with example card JSON + install instructions (Nix-flake placeholder fine; real flake integration follow-up).

    Acceptance (hard gates):
    - cargo build -p hn-briefer — clean.
    - cargo test -p hn-briefer — integration test passes.
    - cargo clippy -p hn-briefer --all-targets -- -D warnings — clean.
    - cargo fmt --check — clean.
    - Static import check: grep -r 'use chief_core\|use chief_ui\|use chief_oauth' prototypes/hn-briefer/src/ returns nothing (pack only imports chief-sdk, stdlib, and well-known utility crates: serde, reqwest, tokio, anyhow).
    - Manifest declares all 5 grants with usage_reason populated. No empty usage_reason strings.
    - Card emission uses Badge::Handled (from chief-sdk enum, closed set per ADR-0012 + ADR-0011).

    Git + PR workflow:
      export PLANDB_DB=/Users/santoshkumarradha/Documents/agentfield/code/labs/nix/.plandb.db
      export PLANDB_AGENT=codex-hn-brief
      cd ../chief-os-w5-hn-brief
      plandb task claim t-w5-hn-brief2 --agent $PLANDB_AGENT
      plandb task start t-w5-hn-brief2 --agent $PLANDB_AGENT
      # ... do the work ...
      git add prototypes/hn-briefer Cargo.toml
      git commit -m 'feat(pack): HN + Substack briefer pack (t-w5-hn-brief2)\n\nFirst dogfood consuming only @chief-os/sdk public API.\nValidates ADR-0010 parity and ADR-0011 import discipline.\n\nCo-Authored-By: Codex <noreply@openai.com>'
      git push -u origin int/hn-briefer
      gh pr create --title 'feat(pack): HN + Substack briefer (first dogfood)' --body 'Closes t-w5-hn-brief2. First pack built entirely against the public @chief-os/sdk surface. Validates the SDK is complete enough to ship a real pack.'
      plandb done --next --agent $PLANDB_AGENT --result '{"pr":"<url>","grants":5,"cards_emitted_per_day":1}'

    Non-goals:
    - Substack feed discovery (user manually configures the Substack URL in a pack setting, stub that via a hardcoded list at v0).
    - OAuth (HN + Substack public RSS need no OAuth — explicit design choice).
    - Actual LLM routing (use the ctx.llm() stub; real routing is chief-core concern).
    - UI rendering in React — Brief consumer renders the Card via chief-ui; pack only emits data.

    References:
    - docs/16-pack-sdk.md
    - docs/18-ui-standardization.md
    - adr/0010-sdk-public-api-stability.md
    - adr/0011-ui-stack-and-component-library.md
    - prototypes/hello-world-pack/ (reference for manifest + Pack trait pattern)

