[package]
name = "chief-inference"
version = "0.1.0"
edition = "2021"
description = "Signed Inference with Ed25519 attestation — ADR-0009 prototype"
authors = ["santosh"]
publish = false

[dependencies]
rand = "0.8"
unicode-normalization = "0.1"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
signature = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
rmp-serde = "1.1"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
tracing = "0.1"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "attest_overhead_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
