[package]
name = "chief-harness-proto"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[lib]
path = "src/lib.rs"

[[test]]
name = "swap_test"
path = "tests/swap_test.rs"
