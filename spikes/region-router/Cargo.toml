[package]
name = "chief-region-router-proto"
version = "0.1.0"
edition = "2021"
authors = ["Santosh Kumar Radha <santosh@agentfield.ai>"]
description = "Chief OS Region Router — deterministic HAX region classifier"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "classify_bench"
harness = false
